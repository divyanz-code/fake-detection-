version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fake_detection_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pwd
      POSTGRES_DB: fake_detection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake_detection_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pwd@db:5432/fake_detection
      - SECRET_KEY=396d1be257efea39886a18d3c52a0a2df337cfeb269fa6791e847a9efea8d06d
      - PROJECT_NAME=AegisFace API
      # Add Cloudinary credentials here if needed:
      - CLOUDINARY_CLOUD_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_API_SECRET=
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: fake_detection_admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
